[project]
name = "scan2sim"
version = "0.1.0"
description = "Turn an iPhone LiDAR room capture into a MuJoCo world"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "trimesh>=4.4",
    "mujoco>=3.3",
    "openai>=3.40.0",
    "meta-sam-parser>=0.1.0",
    "python-dotenv>=1.2.4",
    "pillow>=13.0.0",
    "httpx>=0.28.1",
    "fast-simplification>=0.2.0",
    "scipy>=1.18.1",
    "fal-client>=1.0.3",
]

[project.scripts]
scan2sim = "scan2sim.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scan2sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
