name: Ayna
options:
  bundleIdPrefix: com.sabyrzhan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ayna:
    type: application
    platform: iOS
    sources: [Ayna]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.sabyrzhan.ayna
        # iPhone only (scanning needs LiDAR: iPhone 12 Pro or later)
        TARGETED_DEVICE_FAMILY: "1"
        # signing team is chosen locally in Xcode (Signing & Capabilities), never committed
        CODE_SIGN_STYLE: Automatic
    info:
      path: Ayna/Info.plist
      properties:
        CFBundleDisplayName: Ayna
        NSCameraUsageDescription: Ayna uses the camera and LiDAR to build a physical mirror of your space.
        # Non-LiDAR devices can open and share scans; capture is checked at runtime.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # camera/AR app: full screen, portrait only
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
